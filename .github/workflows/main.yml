# GitHub Action: whenever creating a new release of the source code,
# also create a release of the installable plugin.
# Steps to execute:
# - Checkout the source code
# - Create a .zip file, excluding:
#   - All hidden files (.git, .gitignore, etc)
#   - All development files, ending in .dist
#   - All composer files <= after installing dependencies, no need for them anymore
#   - Markdown files concerning development
#   - Folder build/ <= created only to store the .zip file
#   - Folder dev-helpers/ <= not needed for the plugin
#   - Folder tests/ <= the unit tests
# - Upload the .zip file as an artifact to the action (this step is possibly optional)
# - Upload the .zip file as a release, for download
name: Generate Installable Plugin, and Upload as Release Asset
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Upload Release Asset
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the .zip file to the release.
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build project
        run: |
          mkdir build
      # The patterns are quoted, so zip (and not the shell) matches them
      # against the full path of every file.
      - name: Create artifact
        run: >-
          zip -X -r build/wp-api-privacy.zip .
          -x '*.git*' 'node_modules/*' '.*' '*/.*'
          CODE_OF_CONDUCT.md CONTRIBUTING.md ISSUE_TEMPLATE.md PULL_REQUEST_TEMPLATE.md
          '*.dist' '*.yml' '*.neon' 'composer.*'
          'dev-helpers*' 'build*' 'wporg-assets*' 'phpunit*' 'tests/*'
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
            name: wp-api-privacy
            path: build/wp-api-privacy.zip
      # The plugin's updater downloads releases/download/{tag}/wp-api-privacy.zip,
      # where the tag is the Stable header (no "v" prefix), so keep this file name.
      - name: Upload to release
        run: gh release upload "$RELEASE_TAG" build/wp-api-privacy.zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
